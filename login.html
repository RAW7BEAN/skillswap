<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | SkillSwap</title>
    <meta name="description" content="Log in to your SkillSwap account to connect with peers and swap skills.">
    <meta name="theme-color" content="#6366f1">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <a href="#main-auth" class="skip-link">Skip to login form</a>

    <!-- =========================
         NAVIGATION
    ========================== -->
    <header class="dashboard-navbar" role="banner">
        <div class="logo">
            <a href="index.html" aria-label="SkillSwap Home">
                <img src="favicon.svg" alt="SkillSwap Icon" class="logo-mark">
                Skill<span>Swap</span>
            </a>
        </div>

        <nav aria-label="Main Navigation">
            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>
            <a href="signup.html">Join Free</a>
        </nav>

        <div class="nav-actions">
            <a href="signup.html" class="primary-btn" style="padding: 8px 16px; font-size: 13px;">Sign Up Free →</a>
        </div>
    </header>

    <!-- =========================
         LOGIN CARD
    ========================== -->
    <main class="auth-page-container" id="main-auth">
        <div class="auth-card">
            <div class="auth-header">
                <img src="favicon.svg" alt="SkillSwap Logo" style="width: 48px; height: 48px; margin: 0 auto;">
                <h1>Welcome Back</h1>
                <p>Log in to continue your peer skill exchanges</p>
            </div>

            <!-- SSO Social Login -->
            <div class="sso-button-group">
                <button class="sso-btn" onclick="handleDemoLogin('google')">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.8s.2-2.1.4-2.8L1.9 6.3C.7 8.7 0 10.3 0 12s.7 3.3 1.9 5.7l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
                    Continue with Google
                </button>
                <button class="sso-btn" onclick="handleDemoLogin('github')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#24292e"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    Continue with GitHub
                </button>
            </div>

            <div class="auth-divider">
                <span>OR EMAIL</span>
            </div>

            <!-- Standard Auth Form -->
            <form onsubmit="handleUserLogin(event)">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="e.g. saaladin@skillswap.local" value="saaladin@skillswap.local" required>
                </div>

                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px;">
                        <label for="loginPassword" style="margin-bottom: 0;">Password</label>
                        <a href="javascript:void(0)" onclick="alert('Password reset link sent to your registered email!')" style="font-size: 12px; color: var(--primary); font-weight: 700;">Forgot password?</a>
                    </div>
                    <input type="password" id="loginPassword" placeholder="••••••••" value="password123" required>
                </div>

                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 20px;">
                    <input type="checkbox" id="rememberMe" checked style="width: auto; min-height: auto; accent-color: var(--primary);">
                    <label for="rememberMe" style="font-size: 13px; color: var(--slate-600); margin-bottom: 0; cursor: pointer;">Remember this browser</label>
                </div>

                <button type="submit" class="primary-btn" style="width: 100%; padding: 14px; font-size: 15px;">
                    Log In to SkillSwap →
                </button>
            </form>

            <!-- Quick Demo Profile Selector -->
            <div class="demo-login-box">
                <p><strong>⚡ Quick Demo Login:</strong></p>
                <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                    <button class="secondary-btn" style="padding: 6px 12px; font-size: 12px; min-height: 32px;" onclick="quickLoginUser(1)">
                        Alex (UI/UX)
                    </button>
                    <button class="secondary-btn" style="padding: 6px 12px; font-size: 12px; min-height: 32px;" onclick="quickLoginUser(2)">
                        Riya (Graphics)
                    </button>
                    <button class="secondary-btn" style="padding: 6px 12px; font-size: 12px; min-height: 32px;" onclick="quickLoginDefault()">
                        Saaladin (You)
                    </button>
                </div>
            </div>

            <p style="text-align: center; font-size: 13px; color: var(--slate-500); margin-top: 24px;">
                Don't have an account yet? <a href="signup.html" style="color: var(--primary); font-weight: 700;">Sign up for free</a>
            </p>
        </div>
    </main>

    <footer class="site-footer" role="contentinfo">
        <p>© 2026 SkillSwap Nepal. Turn your knowledge into opportunities.</p>
    </footer>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="users.js"></script>
    <script src="script.js"></script>
</body>
</html>
